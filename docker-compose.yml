version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: ai-intelligence-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sushanth123
      POSTGRES_DB: customer_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-intelligence-network

  # Redis (caching, rate limiting, job-status store, WebSocket token blocklist)
  redis:
    image: redis:7-alpine
    container_name: ai-intelligence-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-intelligence-network

  # Flask API Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-intelligence-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: sushanth123
      DB_NAME: customer_intelligence
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      FLASK_ENV: production
      PYTHONUNBUFFERED: 1
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai-intelligence-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-intelligence-frontend
    ports:
      - "9000:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:5000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai-intelligence-network

volumes:
  postgres_data:

networks:
  ai-intelligence-network:
    driver: bridge
